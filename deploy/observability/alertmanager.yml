# Phase-2 routing: every alert lands on the 'null' receiver and is dropped.
# Phase 3 will swap this for a webhook into the Console so operators see
# firing alerts in the UI. Keep the receiver list strictly additive then.

route:
  receiver: 'null'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'null'
