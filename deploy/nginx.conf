server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — every unknown path hits index.html so
    # TanStack Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable — long cache.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No-cache on the entry HTML so refreshes pick up new bundles.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
