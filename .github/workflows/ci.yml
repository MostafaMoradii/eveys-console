name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm gen:api-types
      # Workspace packages publish via `main: ./dist/index.js` so the
      # apps' typecheck needs the built artefacts to resolve them.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  validate-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the official Prometheus / Alertmanager images and use the
      # bundled promtool / amtool to validate the configs. Catches a
      # broken alert expression or YAML typo before it lands on prod.
      - name: promtool check config
        run: |
          docker run --rm --entrypoint=promtool \
            -v "${{ github.workspace }}/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.0.1 \
            check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint=promtool \
            -v "${{ github.workspace }}/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.0.1 \
            check rules /etc/prometheus/alerts.yml
      - name: amtool check-config
        run: |
          docker run --rm --entrypoint=amtool \
            -v "${{ github.workspace }}/deploy/observability:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml
